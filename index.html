<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess AI - Vincent Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="frontend/src/styles/app.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="header-left">
        <h1>Chess <em>AI</em></h1>
        <div class="byline">Vincent Do &mdash; Playable Chess AI Project</div>
      </div>
      <div class="conn-badge" id="conn-badge">
        <span class="conn-dot"></span>
        <span id="conn-text">Connecting&hellip;</span>
      </div>
    </header>

    <main class="main-grid">
      <section class="board-wrap" aria-label="Chessboard">
        <div class="board-frame" id="board-frame">
          <div id="board"></div>

          <div class="board-overlay" id="think-overlay">
            <div class="spin-ring"></div>
            <div class="thinking-lbl">Thinking&hellip;</div>
          </div>

          <div class="go-overlay" id="go-overlay">
            <div class="go-card">
              <div class="go-result" id="go-result">Game over</div>
              <div class="go-detail" id="go-detail"></div>
              <div class="go-actions">
                <button class="btn-gold action-inline" id="btn-go-new">New game</button>
                <button class="ghost-btn" id="btn-go-review">Review board</button>
              </div>
            </div>
          </div>
        </div>

        <div class="board-controls">
          <button class="ghost-btn" id="btn-flip">Flip board</button>
          <button class="ghost-btn" id="btn-undo">Undo move</button>
          <button class="ghost-btn" id="btn-show-result" hidden>Show result</button>
        </div>
      </section>

      <aside class="panel" aria-label="Game controls">
        <section class="card">
          <div class="card-label">Players</div>

          <div class="player-row">
            <div class="piece-glyph w">&#9817;</div>
            <label class="player-label" for="white-sel">White</label>
            <select id="white-sel">
              <option value="human">Human</option>
              <option value="alphabeta">Alphabeta AI</option>
              <option value="stockfish" selected>Stockfish</option>
              <option value="random">Random</option>
              <option value="magnus" id="mo-w" disabled>Magnus Carlsen</option>
            </select>
          </div>

          <div class="vs-strip">versus</div>

          <div class="player-row">
            <div class="piece-glyph b">&#9823;</div>
            <label class="player-label" for="black-sel">Black</label>
            <select id="black-sel">
              <option value="human" selected>Human</option>
              <option value="alphabeta">Alphabeta AI</option>
              <option value="stockfish">Stockfish</option>
              <option value="random">Random</option>
              <option value="magnus" id="mo-b" disabled>Magnus Carlsen</option>
            </select>
          </div>

          <div class="slider-group" id="depth-grp" hidden>
            <div class="slider-header">
              <label for="depth-sl">Alphabeta depth</label>
              <span class="slider-val" id="depth-val">3</span>
            </div>
            <input type="range" id="depth-sl" min="1" max="4" value="3" step="1">
            <div class="slider-hints"><span>Fast</span><span>Strongest</span></div>
          </div>

          <div class="slider-group" id="skill-grp" hidden>
            <div class="slider-header">
              <label for="skill-sl">Stockfish skill level</label>
              <span class="slider-val" id="skill-val">10</span>
            </div>
            <input type="range" id="skill-sl" min="0" max="20" value="10" step="1">
            <div class="slider-hints"><span>Beginner</span><span>Master</span></div>
          </div>

          <div class="slider-group" id="magnus-grp" hidden>
            <div class="slider-header">
              <label for="mcts-toggle">Use search (MCTS)</label>
              <input type="checkbox" id="mcts-toggle">
            </div>
            <div class="slider-hints"><span>Faster, raw policy</span><span>Slower, sharper</span></div>
          </div>

          <button class="btn-gold" id="btn-start">Start game</button>
          <button class="btn-ghost" id="btn-reset">Reset board</button>
        </section>

        <section class="card">
          <div class="card-label">Status</div>
          <div class="status-inner">
            <div class="turn-glyph" id="turn-glyph">&#9817;</div>
            <div>
              <div class="status-txt" id="status-txt">Pick players and press Start.</div>
              <div class="status-sub" id="status-sub"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-label">Move history</div>
          <div class="history-scroll">
            <div id="hist-list"><div class="history-empty">No moves yet</div></div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
  <script type="module" src="frontend/src/main.js"></script>
</body>
</html>
