name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --requirement requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q backend evaluation experiments inference training load_model.py neural_network.py
      - name: Validate production WSGI entry
        run: gunicorn --check-config backend.app:app
      - name: Run fast tests
        run: python -m pytest -q
